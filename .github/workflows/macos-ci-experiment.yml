name: macOS CI experiment

on:
  push:
    branches: [ethan/wip-macos-ci-performance]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: macos-15
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[full-macos]') && 35 || 12 }}
    env:
      DISABLE_MPS: "1"
      GLOO_SOCKET_IFNAME: lo0
      UV_EXCLUDE_NEWER: "2 days"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - run: uv venv --python 3.13

      - name: Install the benchmark dependencies
        if: ${{ !contains(github.event.head_commit.message, '[full-macos]') }}
        run: |
          uv pip install . 'torch==2.13.*' 'numpy<2.4.5' 'pytest==9.0.2' 'pytest-timeout==2.4.0'

      - name: Measure the standard TCP and file stores
        if: ${{ !contains(github.event.head_commit.message, '[full-macos]') }}
        run: .venv/bin/python .github/diagnostics/measure_tcp_store.py

      - name: Run the full-stage baseline
        if: ${{ !contains(github.event.head_commit.message, '[full-macos]') }}
        continue-on-error: true
        run: |
          .venv/bin/python -m pytest .github/diagnostics/test_macos_rendezvous.py \
            -s --timeout=180 --durations=0

      - name: Build and verify the numeric loopback probe
        run: |
          clang -dynamiclib -Wall -Wextra -Werror .github/diagnostics/numeric_loopback.c \
            -o "$RUNNER_TEMP/numeric-loopback.dylib"
          DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/numeric-loopback.dylib" .venv/bin/python -c \
            'import socket; assert socket.getnameinfo(("127.0.0.1", 1), socket.NI_NUMERICSERV)[0] == "127.0.0.1"'

      - name: Repeat both measurements with numeric loopback addresses
        if: ${{ !contains(github.event.head_commit.message, '[full-macos]') }}
        run: |
          export DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/numeric-loopback.dylib"
          .venv/bin/python .github/diagnostics/measure_tcp_store.py
          .venv/bin/python -m pytest .github/diagnostics/test_macos_rendezvous.py \
            -s --timeout=180 --durations=0

      - name: Install the full PyTorch test dependencies
        if: contains(github.event.head_commit.message, '[full-macos]')
        env:
          PACKAGE_NAME: pytorch
          FREEZE_REQUIREMENTS: "1"
          UV_TORCH_BACKEND: cpu
        run: |
          source .venv/bin/activate
          uv pip install -q -r .actions/requirements.txt -r requirements/ci.txt
          python -m wget https://raw.githubusercontent.com/Lightning-AI/utilities/main/scripts/adjust-torch-versions.py
          for requirements in requirements/**/*.txt; do
            python ./adjust-torch-versions.py "$requirements" 2.13
          done
          uv pip install '.[extra,test,strategies]' --upgrade --find-links=https://download.pytorch.org/whl/cpu/
          uv pip install 'setuptools<80.10.3'
          uv pip uninstall lightning
          python requirements/pytorch/check-avail-extras.py
          python -c 'import torch; assert torch.__version__.startswith("2.13."), torch.__version__'
          python .actions/assistant.py copy_replace_imports --source_dir=./tests \
            --source_import=lightning.fabric,lightning.pytorch \
            --target_import=lightning_fabric,pytorch_lightning
          mv src "$RUNNER_TEMP/lightning-source"
          bash .actions/pull_legacy_checkpoints.sh
          (cd tests/legacy && bash generate_checkpoints.sh)

      - name: Restore datasets for the full PyTorch suite
        if: contains(github.event.head_commit.message, '[full-macos]')
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: Datasets
          key: pl-dataset

      - name: Run the full PyTorch suite with numeric loopback addresses
        if: contains(github.event.head_commit.message, '[full-macos]')
        working-directory: tests/tests_pytorch
        run: |
          source ../../.venv/bin/activate
          export DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/numeric-loopback.dylib"
          python utilities/test_warnings.py
          python -m coverage run --source pytorch_lightning -m pytest . -v \
            --timeout=360 --durations=50 --random-order-seed=45254110158
