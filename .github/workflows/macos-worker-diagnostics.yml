name: macOS worker diagnostics

on:
  push:
    branches: [ethan/ci-macos-worker-diagnostics]

permissions:
  contents: read

jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DISABLE_MPS: "1"
      GLOO_SOCKET_IFNAME: lo0
      UV_EXCLUDE_NEWER: "2 days"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Measure TCP store and Gloo group initialization separately
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python 'torch==2.13.*' 'numpy<2.4.5'
          .venv/bin/python .github/diagnostics/measure_macos_workers.py
