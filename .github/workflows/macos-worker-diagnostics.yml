name: macOS worker diagnostics

on:
  push:
    branches: [ethan/ci-macos-worker-diagnostics]

permissions:
  contents: read

jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DISABLE_MPS: "1"
      GLOO_SOCKET_IFNAME: lo0
      UV_EXCLUDE_NEWER: "2 days"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Compare PyTorch versions on one macOS runner
        shell: bash
        run: |
          for version in 2.6 2.7 2.13; do
            echo "::group::PyTorch $version"
            uv venv --python 3.12 ".venv-$version"
            python=".venv-$version/bin/python"
            uv pip install --python "$python" . "torch==$version.*" 'numpy<2.4.5' \
              'pytest==9.0.2' 'pytest-timeout==2.4.0' 'pytest-rerunfailures==16.1' 'coverage==7.13.5'
            "$python" .github/diagnostics/measure_macos_workers.py
            "$python" -m coverage run --source lightning -m pytest \
              tests/tests_pytorch/profilers/test_profiler.py::test_simple_profiler_distributed_files \
              --timeout=180 --durations=0 -q
            echo "::endgroup::"
          done
